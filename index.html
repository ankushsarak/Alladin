<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alladin</title>
<meta name="description" content="Your AI-powered market intelligence.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ================= ALLADIN — design tokens ================= */
:root{
  --page:#0A0A0A;
  --s1:#111111;
  --s2:#171717;
  --s3:#1D1D1D;
  --border:rgba(244,241,232,.08);
  --border-strong:rgba(244,241,232,.16);
  --ink:#F4F1E8;
  --ink-2:#A39E93;
  --ink-3:#5C584F;
  --pos:#5CA97C;
  --neg:#C0625A;
  --warn:#C99B5F;
  --accent:#E3D5B8;
  --accent-dim:rgba(227,213,184,.12);
  --display:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r-lg:24px;
  --r-md:16px;
  --maxw:1240px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--page);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#0A0A0A}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
img{max-width:100%}

/* ---------- typography ---------- */
.display{
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  letter-spacing:-.02em;line-height:.95;text-wrap:balance;
}
.d-xl{font-size:clamp(44px,8vw,88px)}
.d-lg{font-size:clamp(36px,5.5vw,64px)}
.d-md{font-size:clamp(26px,3.4vw,40px)}
.d-sm{font-size:clamp(20px,2.4vw,28px)}
.eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
}
.eyebrow.lit{color:var(--accent)}
.sub{color:var(--ink-2);font-size:clamp(15px,1.6vw,18px);max-width:34em;line-height:1.65}
.num{font-family:var(--body);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.section{padding-block:clamp(64px,9vw,128px)}
.section.tight{padding-block:clamp(40px,6vw,72px)}
.hr{border:0;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.5vw,28px)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.5vw,28px)}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- nav ---------- */
#nav{
  position:fixed;inset:0 0 auto 0;z-index:60;
  transition:transform .45s var(--ease),background .3s;
  background:linear-gradient(rgba(10,10,10,.92),rgba(10,10,10,.75) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
#nav.hide{transform:translateY(-100%)}
#nav .bar{
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;gap:32px;
  padding:20px clamp(20px,4vw,48px);
  transition:padding .35s var(--ease);
}
#nav.compact .bar{padding-top:12px;padding-bottom:12px}
.logo{
  font-family:var(--display);font-weight:800;font-size:19px;
  letter-spacing:.34em;text-transform:uppercase;color:var(--ink);
  display:inline-flex;align-items:baseline;
}
.logo i{font-style:normal;color:var(--accent);letter-spacing:0;margin-left:2px}
.navlinks{display:flex;gap:6px;margin-left:12px}
.navlinks a{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);padding:8px 12px;border-radius:99px;
  transition:color .2s,background .2s;
}
.navlinks a:hover{color:var(--ink)}
.navlinks a.on{color:var(--ink);background:var(--s2)}
.navright{margin-left:auto;display:flex;align-items:center;gap:18px}
.mkt-chip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--pos);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,169,124,.45)}70%{box-shadow:0 0 0 9px rgba(92,169,124,0)}100%{box-shadow:0 0 0 0 rgba(92,169,124,0)}}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--s3);border:1px solid var(--border-strong);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
@media(max-width:960px){.navlinks,.mkt-chip{display:none}}

/* mobile bottom nav */
#bnav{display:none}
@media(max-width:960px){
  #bnav{
    display:flex;position:fixed;inset:auto 0 0 0;z-index:60;
    background:rgba(13,13,13,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding:10px max(10px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-bottom));
  }
  #bnav a{flex:1;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);padding:8px 2px;border-radius:12px}
  #bnav a.on{color:var(--accent)}
  main{padding-bottom:76px}
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  padding:16px 26px;border-radius:99px;
  background:var(--accent);color:#0C0B09;
  transition:transform .25s var(--ease),background .2s;
}
.btn:hover{transform:translateY(-1px);background:#EFE4CC}
.btn .arr{transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(5px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border-strong)}
.btn.ghost:hover{background:var(--s2)}
.textbtn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);
  padding:6px 0;border-bottom:1px solid transparent;transition:color .2s;
}
.textbtn:hover{color:var(--accent)}
.textbtn .arr{transition:transform .25s var(--ease)}
.textbtn:hover .arr{transform:translateX(5px)}

/* ---------- cards & surfaces ---------- */
.card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:clamp(22px,3vw,36px);
  transition:transform .35s var(--ease),border-color .3s,background .3s;
  position:relative;overflow:hidden;
}
.card.hoverable:hover{transform:translateY(-3px);border-color:var(--border-strong);background:var(--s2)}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:6px 12px;border-radius:99px;border:1px solid var(--border-strong);color:var(--ink-2);
}
.chip.buy{color:var(--pos);border-color:rgba(92,169,124,.4)}
.chip.wait{color:var(--warn);border-color:rgba(201,155,95,.4)}
.chip.acc{color:var(--accent);border-color:rgba(227,213,184,.35)}
.chip.bad{color:var(--neg);border-color:rgba(192,98,90,.4)}

/* ---------- hero ---------- */
.hero{padding-block:clamp(150px,20vh,220px) clamp(56px,8vw,96px)}
.hero .greet{color:var(--ink-3)}
.hero h1{margin:14px 0 26px}
.countline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.countline .clock{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--accent)}

/* market panels */
.mpanel{min-height:230px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.mpanel .top{display:flex;justify-content:space-between;align-items:flex-start}
.mpanel .idx{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.5vw,54px);letter-spacing:-.02em;line-height:1}
.mpanel .spark{margin:0 -8px}
.mpanel .foot{display:flex;justify-content:space-between;align-items:center}

/* ---------- tip cards ---------- */
.tipcard{
  display:grid;grid-template-columns:1fr auto;gap:24px;
  background:var(--s1);border:1px solid var(--border);border-radius:28px;
  padding:clamp(26px,3.4vw,44px);position:relative;overflow:hidden;
  transition:transform .4s var(--ease),border-color .3s;cursor:pointer;
}
.tipcard:hover{transform:translateY(-4px);border-color:var(--border-strong)}
.tipcard .index{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--ink-3)}
.tipcard .ticker{font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(34px,4.6vw,58px);letter-spacing:-.02em;line-height:.95;margin:10px 0 4px}
.tipcard .cname{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.tipcard .chips{display:flex;gap:10px;margin:20px 0 26px;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:18px 26px;max-width:620px}
.levels .lv .v{font-size:clamp(19px,2vw,26px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.levels .lv .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.tipcard .cta{margin-top:30px}
.tipcard .art{position:absolute;inset:0;pointer-events:none;opacity:.8}
.tipcard>*{position:relative;z-index:1}
.tipcard .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;min-width:120px}
@media(max-width:760px){.tipcard{grid-template-columns:1fr}.tipcard .side{flex-direction:row;align-items:center;justify-content:space-between;order:-1}}

/* sector art — abstract, low-key */
.art.tech{background:
  radial-gradient(420px 220px at 88% 8%,rgba(227,213,184,.08),transparent 60%),
  repeating-linear-gradient(90deg,rgba(244,241,232,.025) 0 1px,transparent 1px 56px),
  repeating-linear-gradient(0deg,rgba(244,241,232,.02) 0 1px,transparent 1px 56px)}
.art.energy{background:
  radial-gradient(500px 260px at 85% 110%,rgba(201,155,95,.09),transparent 65%),
  radial-gradient(380px 200px at 100% 0%,rgba(227,213,184,.05),transparent 60%)}
.art.finance{background:
  linear-gradient(115deg,transparent 55%,rgba(244,241,232,.028) 55.2% 62%,transparent 62.2%),
  linear-gradient(115deg,transparent 68%,rgba(244,241,232,.02) 68.2% 80%,transparent 80.2%),
  radial-gradient(400px 240px at 92% 4%,rgba(227,213,184,.06),transparent 60%)}
.art.health{background:
  radial-gradient(circle at 90% 15%,rgba(92,169,124,.07) 0 8%,transparent 9%),
  radial-gradient(circle at 96% 42%,rgba(92,169,124,.05) 0 5%,transparent 6%),
  radial-gradient(circle at 82% 55%,rgba(227,213,184,.04) 0 4%,transparent 5%)}

/* stars */
.stars{letter-spacing:3px;color:var(--accent);font-size:13px}
.stars .off{color:var(--ink-3)}

/* ---------- overlay (thesis / day detail) ---------- */
#overlay{
  position:fixed;inset:0;z-index:80;background:var(--page);
  overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(4%);opacity:0;pointer-events:none;
  transition:transform .5s var(--ease),opacity .4s;
}
#overlay.open{transform:none;opacity:1;pointer-events:auto}
.ov-top{
  position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:18px clamp(20px,4vw,48px);
  background:linear-gradient(rgba(10,10,10,.94),rgba(10,10,10,.8) 70%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.closebtn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);
  display:grid;place-items:center;color:var(--ink-2);font-size:18px;
  transition:background .2s,color .2s;
}
.closebtn:hover{background:var(--s2);color:var(--ink)}

/* expandable analysis rows */
.xrow{border-top:1px solid var(--border)}
.xrow:last-child{border-bottom:1px solid var(--border)}
.xrow>button{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:26px 0;text-align:left;
}
.xrow .xt{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;
  font-size:clamp(19px,2.4vw,27px);transition:color .25s}
.xrow>button:hover .xt{color:var(--accent)}
.xrow .xi{font-family:var(--mono);color:var(--ink-3);font-size:16px;transition:transform .35s var(--ease)}
.xrow.open .xi{transform:rotate(45deg)}
.xbody{max-height:0;overflow:hidden;transition:max-height .5s var(--ease)}
.xbody .inner{padding:0 0 30px;color:var(--ink-2);max-width:62ch;line-height:1.7}

/* thesis statements */
.saying{font-family:var(--display);font-weight:600;font-size:clamp(21px,2.6vw,30px);
  letter-spacing:-.01em;line-height:1.25;padding:22px 0;border-top:1px solid var(--border)}
.saying:first-child{border-top:0}
.saying::before{content:'“';color:var(--ink-3);margin-right:2px}
.saying::after{content:'”';color:var(--ink-3)}

/* plan grid */
.plangrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
@media(max-width:640px){.plangrid{grid-template-columns:repeat(2,1fr)}}
.plangrid .cell{background:var(--s1);padding:26px 22px}
.plangrid .cell .v{font-size:clamp(20px,2.2vw,28px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.plangrid .cell .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}

/* risk/reward bar */
.rrviz{margin-top:26px}
.rrbar{display:flex;height:64px;border-radius:14px;overflow:hidden;gap:2px}
.rrbar .seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:11px;letter-spacing:.12em;min-width:52px}
.rrbar .loss{background:rgba(192,98,90,.16);color:var(--neg)}
.rrbar .gain{background:rgba(92,169,124,.13);color:var(--pos)}
.rrlabels{display:flex;gap:2px;margin-top:10px}
.rrlabels span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  min-width:52px;text-align:center}

/* steps (zerodha/sarwa) */
.tabs{display:inline-flex;border:1px solid var(--border-strong);border-radius:99px;padding:4px;gap:4px;margin-bottom:34px}
.tabs button{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 22px;border-radius:99px;transition:all .25s}
.tabs button.on{background:var(--accent);color:#0C0B09}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.step{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);padding:22px}
.step .n{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--accent)}
.step .t{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:17px;margin:10px 0 6px}
.step .d{font-size:13px;color:var(--ink-2);line-height:1.55}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.calhead .mn{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.01em}
.calnav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-strong);color:var(--ink-2);transition:background .2s}
.calnav button:hover:not(:disabled){background:var(--s2);color:var(--ink)}
.calnav button:disabled{opacity:.3;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.calgrid .dow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
  text-align:center;padding:8px 0}
.day{
  aspect-ratio:.9;border-radius:14px;border:1px solid transparent;background:var(--s1);
  padding:10px 10px 8px;display:flex;flex-direction:column;gap:2px;
  font-variant-numeric:tabular-nums;transition:transform .3s var(--ease),border-color .25s,background .25s;
}
.day.blank{background:transparent}
.day.traded{cursor:pointer;border-color:var(--border)}
.day.traded:hover{transform:translateY(-3px);border-color:var(--border-strong);background:var(--s2)}
.day.today{border-color:rgba(227,213,184,.5)}
.day .dn{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.day .mini{font-size:10.5px;line-height:1.5;font-family:var(--mono);letter-spacing:.02em}
.day .tot{margin-top:auto;font-weight:600;font-size:clamp(11px,1.4vw,15px);letter-spacing:-.01em}
@media(max-width:760px){.day .mini{display:none}.day{aspect-ratio:.85;padding:8px}}

/* ---------- performance ---------- */
.heronum{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:.9;
  font-size:clamp(72px,14vw,170px)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.statrow .cell{background:var(--s1);padding:28px 24px}
.statrow .cell .v{font-size:clamp(24px,3vw,38px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.statrow .cell .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}

/* charts */
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto}
.tt{
  position:absolute;pointer-events:none;z-index:4;opacity:0;transition:opacity .15s;
  background:var(--s3);border:1px solid var(--border-strong);border-radius:12px;
  padding:10px 14px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-115%);
  font-variant-numeric:tabular-nums;
}
.tt .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.legendrow{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.legendrow span{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.legendrow i{width:16px;height:3px;border-radius:2px;display:inline-block}

/* sector bars */
.sbar{display:grid;grid-template-columns:130px 1fr 80px;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--border)}
.sbar:last-child{border-bottom:1px solid var(--border)}
.sbar .nm{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.sbar .track{height:6px;border-radius:3px;background:var(--s2);position:relative;overflow:hidden}
.sbar .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent);width:0;
  transition:width 1.1s var(--ease)}
.sbar.negbar .fill{background:var(--neg)}
.sbar .pv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:600px){.sbar{grid-template-columns:96px 1fr 66px;gap:10px}}

/* watchlist */
.wrow{
  display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;
  padding:26px 0;border-top:1px solid var(--border);cursor:default;
  transition:padding .25s var(--ease);
}
.wrow:last-child{border-bottom:1px solid var(--border)}
.wrow:hover{padding-left:8px}
.wrow .tk{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,2.6vw,30px);letter-spacing:-.01em}
.wrow .nm{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.wrow .px{text-align:right;font-variant-numeric:tabular-nums}
.score{
  width:64px;height:64px;border-radius:50%;border:1px solid var(--border-strong);
  display:grid;place-items:center;flex-direction:column;text-align:center;
}
.score b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.score span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--ink-3)}

/* verdict / post-market */
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
@media(max-width:860px){.verdict{grid-template-columns:1fr}}
.bignum{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:clamp(52px,8vw,104px);line-height:.9}

/* ---------- boot sequence ---------- */
#boot{
  position:fixed;inset:0;z-index:100;background:var(--page);
  display:grid;place-items:center;transition:opacity .6s,visibility .6s;
}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
#boot .line{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;
  font-size:clamp(24px,4.5vw,44px);text-align:center;min-height:1.2em}
#boot .sig{margin-top:34px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;padding:0 20px}
#boot .sig span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);transition:color .3s}
#boot .sig span.ok{color:var(--pos)}

/* ---------- motion ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* misc */
.kicker{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.kicker .rule{height:1px;width:44px;background:var(--border-strong)}
.footer{padding-block:60px 90px;color:var(--ink-3);font-size:12.5px;line-height:1.7}
.footer .lg{font-family:var(--display);font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px}
.notice{font-size:12px;color:var(--ink-3);max-width:56ch;line-height:1.7}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,32px)}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.casecard{border-radius:var(--r-lg);border:1px solid var(--border);padding:clamp(22px,3vw,34px);background:var(--s1)}
.casecard.workcase{border-color:rgba(92,169,124,.25)}
.casecard.failcase{border-color:rgba(192,98,90,.25)}
.casecard ul{list-style:none;margin-top:18px}
.casecard li{padding:12px 0;border-top:1px solid var(--border);color:var(--ink-2);font-size:14.5px;line-height:1.6}
.hscroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -20px;padding-left:20px;padding-right:20px}
.hscroll>*{scroll-snap-align:start;flex:none}
</style>

function sparkSVG(vals,w=340,h=90,color=CH.accent){
  const min=Math.min(...vals),max=Math.max(...vals),pad=6;
  const X=i=>pad+i*(w-2*pad)/(vals.length-1);
  const Y=v=>h-pad-(v-min)/(max-min||1)*(h-2*pad);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last=vals[vals.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts} ${w-pad},${h} ${pad},${h}" fill="${color}" opacity=".07"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(vals.length-1)}" cy="${Y(last)}" r="4" fill="${color}"/></svg>`;
}

  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const gl=[0,.5,1].map(t=>{const v=min+(max-min)*t,y=Y(v);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${CH.grid}"/>
      <text x="${w-padR+10}" y="${y+4}" fill="${CH.ink3}" font-size="11" font-family="IBM Plex Mono">${fmt(v)}</text>`}).join('');
  const li=vals.length-1;
  return `<svg viewBox="0 0 ${w} ${h}" data-chart="${id}">
    ${gl}
    <polyline points="${pts} ${X(li)},${h-padB} ${X(0)},${h-padB}" fill="${color}" opacity=".06"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    <line class="xh" x1="0" y1="${padT}" x2="0" y2="${h-padB}" stroke="${CH.ink3}" stroke-dasharray="3 4" opacity="0"/>
    <circle class="xd" r="5" fill="${color}" opacity="0"/>
    <circle cx="${X(li)}" cy="${Y(vals[li])}" r="5" fill="${color}"/>
    <rect class="hit" x="0" y="0" width="${w}" height="${h}" fill="transparent"/></svg>`;
}
function barChartSVG(vals,{w=980,h=260}={}){
  const max=Math.max(...vals.map(Math.abs)),padT=14,padB=14;
  const zero=padT+(h-padT-padB)*(max/(2*max));
  const mid=(h-padT-padB)/2,bw=Math.max(4,(w-40)/vals.length-4);
  const bars=vals.map((v,i)=>{
    const x=8+i*((w-40)/vals.length),bh=Math.max(2,Math.abs(v)/max*mid);
    const y=v>=0?padT+mid-bh:padT+mid;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3"
      fill="${v>=0?CH.pos:CH.neg}" opacity=".85" data-i="${i}"/>`}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" data-chart="daily">
    <line x1="8" y1="${padT+mid}" x2="${w-8}" y2="${padT+mid}" stroke="${CH.grid}"/>
    ${bars}
    <rect class="hit" x="0" y="0" width="${w}" height="${h}" fill="transparent"/></svg>`;
}
function priceChartSVG(t){
  const w=980,h=380,padL=8,padR=110,padT=20,padB=24;
  const mid=(t.entry[0]+t.entry[1])/2;
  const vals=series(t.id.length*991+7,64,mid*.94,.018);
  const drift=(t.price/vals[vals.length-1]);vals.forEach((v,i)=>vals[i]=v*(1+(drift-1)*i/(vals.length-1)));
  const lo=Math.min(...vals,t.stop)*.995,hi=Math.max(...vals,t.targets[0])*1.005;
  const X=i=>padL+i*(w-padL-padR)/(vals.length-1);
  const Y=v=>padT+(1-(v-lo)/(hi-lo))*(h-padT-padB);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const lvl=(v,label,color,dash)=>`<line x1="${padL}" y1="${Y(v)}" x2="${w-padR}" y2="${Y(v)}" stroke="${color}" stroke-width="1" ${dash?'stroke-dasharray="5 5"':''} opacity=".55"/>
    <text x="${w-padR+10}" y="${Y(v)+4}" fill="${color}" font-size="11" font-family="IBM Plex Mono" letter-spacing="1">${label}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}">
    ${[0,.33,.66,1].map(tt=>`<line x1="${padL}" y1="${padT+tt*(h-padT-padB)}" x2="${w-padR}" y2="${padT+tt*(h-padT-padB)}" stroke="${CH.grid}"/>`).join('')}
    ${lvl(t.targets[0],'T1 '+t.cur+fmtI(t.targets[0]),CH.pos,true)}
    ${lvl(t.entry[1],'RESIST '+t.cur+fmtI(t.entry[1]),CH.ink3,true)}
    ${lvl(t.stop,'STOP '+t.cur+fmtI(t.stop),CH.neg,true)}
    <polyline points="${pts} ${X(vals.length-1)},${h-padB} ${X(0)},${h-padB}" fill="${CH.accent}" opacity=".05"/>
    <polyline points="${pts}" fill="none" stroke="${CH.accent}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="5" fill="${CH.accent}"/>
    <text x="${w-padR+10}" y="${Y(vals[vals.length-1])+4}" fill="${CH.ink}" font-size="12" font-weight="600" font-family="Inter">${t.cur}${fmtI(t.price)}</text>
  </svg>`;
}
/* hover wiring for line/bar charts */
function wireChart(box,vals,labels,fmt){
  const svg=box.querySelector('svg'),hit=svg.querySelector('.hit');if(!hit)return;
  let tt=box.querySelector('.tt');
  if(!tt){tt=document.createElement('div');tt.className='tt';box.appendChild(tt)}
  const xh=svg.querySelector('.xh'),xd=svg.querySelector('.xd');
  const vb=svg.viewBox.baseVal;
  const min=Math.min(...vals),max=Math.max(...vals);
  const padL=8,padR=xh?64:8,padT=xh?18:14,padB=xh?26:14;
  hit.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*vb.width;
    const i=Math.max(0,Math.min(vals.length-1,Math.round((mx-padL)/((vb.width-padL-padR)/(vals.length-1)))));
    const X=padL+i*(vb.width-padL-padR)/(vals.length-1);
    const Y=padT+(1-(vals[i]-min)/(max-min||1))*(vb.height-padT-padB);
    if(xh){xh.setAttribute('x1',X);xh.setAttribute('x2',X);xh.style.opacity=1}
    if(xd){xd.setAttribute('cx',X);xd.setAttribute('cy',Y);xd.style.opacity=1}
    tt.style.opacity=1;
    tt.style.left=(X/vb.width*100)+'%';
    tt.style.top=(Y/vb.height*100)+'%';
    tt.innerHTML=`<div class="l">${labels[i]}</div><div class="${vals[i]>=0?'pos':''}">${fmt(vals[i])}</div>`;
  });
  hit.addEventListener('mouseleave',()=>{tt.style.opacity=0;if(xh)xh.style.opacity=0;if(xd)xd.style.opacity=0});
}

function renderCalendar(){
  const mount=$('#calmount');if(!mount)return;
  const names=['','','','','','','July 2026','August 2026','September 2026'];
  const first=new Date(2026,calMonth,1);
  const dow=(first.getDay()+6)%7;
  const dim=new Date(2026,calMonth+1,0).getDate();
  let cells='';
  for(let i=0;i<dow;i++)cells+=`<div class="day blank"></div>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(2026,calMonth,d),k=dkey(dt),rec=DAYMAP[k];
    const isToday=calMonth===8&&d===3;
    if(rec){
      cells+=`<div class="day traded" data-day="${k}" role="button" tabindex="0">
        <span class="dn">${d}</span>
        <span class="mini muted">IN <span class="${cls(rec.ind)}">${pct1(rec.ind)}</span></span>

    }else{
      cells+=`<div class="day ${isToday?'today':''}"><span class="dn">${d}</span>
        ${isToday?'<span class="tot eyebrow lit" style="font-size:9px">LIVE</span>':''}</div>`;
    }
  }
  mount.innerHTML=`
    <div class="calhead">
      <div class="mn">${names[calMonth]}</div>
      <div class="calnav" style="display:flex;gap:10px">
        <button id="calprev" aria-label="Previous month" ${calMonth<=6?'disabled':''}>←</button>

      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>`;
  $('#calprev')?.addEventListener('click',()=>{if(calMonth>6){calMonth--;renderCalendar()}});
  $('#calnext')?.addEventListener('click',()=>{if(calMonth<8){calMonth++;renderCalendar()}});

    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  });
}

const POOL={ind:['RELIANCE','HDFCBANK','INFY','TCS','TATAMOTORS','ICICIBANK','SUNPHARMA','LT'],
             usa:['NVDA','MSFT','AAPL','XOM','JPM','AMZN','GOOGL','META']};
function grade(r){return r>=2?'EXCELLENT':r>=.75?'GOOD':r>=-.5?'NEUTRAL':r>=-1.5?'BAD':'WORSE'}
function dayTips(k,rec,mkt){
  const r=prng([...k].reduce((a,c)=>a+c.charCodeAt(0),mkt==='ind'?11:97));
  const pool=[...POOL[mkt]];const out=[];
  for(let i=0;i<3;i++){
    const t=pool.splice(Math.floor(r()*pool.length),1)[0];
    const ret=rec[mkt]+(r()-.45)*2.4;
    out.push({t,ret,status:ret>1.4?'TARGET HIT':ret<-1.1?'STOPPED':'CLOSED',g:grade(ret)});
  }
  return out;
}

function closeOverlay(){overlay.classList.remove('open');document.body.style.overflow='';setTimeout(()=>{if(!overlay.classList.contains('open'))overlay.innerHTML=''},450)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))(history.length>1?history.back():location.hash=lastRoute)});

/* ---------- shared wiring ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);
  if(e.target.classList.contains('cnt')||e.target.querySelector?.('.cnt'))countUp(e.target);
  if(e.target.id==='sectorbars')e.target.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%');
}}),{threshold:.12,rootMargin:'0px 0px -30px'});
function countUp(scope){
  const els=scope.classList.contains('cnt')?[scope]:scope.querySelectorAll('.cnt');
  els.forEach(el=>{
    if(el.dataset.done)return;el.dataset.done=1;
    const v=parseFloat(el.dataset.v),d=+el.dataset.d||0,p=el.dataset.p||'',s=el.dataset.s||'';
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=p+fmtN(v,d)+s;return}
    const t0=performance.now(),dur=1400;
    const tick=now=>{
      const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
      el.textContent=(v>=0?p:'')+fmtN(v*e,d)+s;
      if(k<1)requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
  });
}
function wireCommon(root){
  root.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  root.querySelectorAll('.xrow>button').forEach(b=>b.addEventListener('click',()=>{
    const row=b.parentElement,body=row.querySelector('.xbody'),open=row.classList.toggle('open');
    b.setAttribute('aria-expanded',open);
    body.style.maxHeight=open?body.scrollHeight+'px':'0px';
  }));
  root.querySelectorAll('[data-tip]').forEach(el=>{
    const go=()=>{location.hash='#/tip/'+el.dataset.tip};
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  });
}

/* ---------- router ---------- */
function route(){
  const h=location.hash||'#/today';
  const m=h.match(/^#\/(tip|day)\/(.+)$/);
  if(m){
    if(!$('#view').innerHTML){
      $('#view').innerHTML=VIEWS.today();wireCommon($('#view'));startClocks();
      $$('#navlinks a,#bnav a').forEach(a=>a.classList.toggle('on',a.dataset.r==='today'));
    }
    if(m[1]==='tip'){const t=tipById(m[2]);if(t){openOverlay(tipOverlayHTML(t));return}}
    if(m[1]==='day'&&DAYMAP[m[2]]){openOverlay(dayOverlayHTML(m[2]));return}
    location.hash='#/today';return;
  }
  if(overlay.classList.contains('open'))closeOverlay();
  const name=h.replace('#/','')||'today';
  const v=VIEWS[name]||VIEWS.today;
  lastRoute='#/'+(VIEWS[name]?name:'today');
  $('#view').innerHTML=v();
  window.scrollTo(0,0);
  $$('#navlinks a,#bnav a').forEach(a=>a.classList.toggle('on',a.dataset.r===name||(!VIEWS[name]&&a.dataset.r==='today')));
  wireCommon($('#view'));
  if(name==='calendar')renderCalendar();
  if(name==='performance'){
    const cum=[];let c=1;DAYS.forEach(x=>{c*=1+x.all/100;cum.push((c-1)*100)});
    const labels=DAYS.map(x=>x.date.toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
    wireChart($('#cumbox'),cum,labels,v=>pct(v));
    wireChart($('#dailybox'),DAYS.map(x=>x.all),labels,v=>pct(v));
    wireChart($('#eqbox'),DAYS.map(x=>x.eq),labels,v=>'₹'+fmtI(v));
  }
  if(name==='today')startClocks();
}
window.addEventListener('hashchange',route);

/* ---------- clocks & market status ---------- */
let clockTimer=null;
function tz(zone){return new Date(new Date().toLocaleString('en-US',{timeZone:zone}))}
function startClocks(){
  clearInterval(clockTimer);
  const el=$('#countdown'),ds=$('#datestamp'),gr=$('#greet');
  const tick=()=>{
    const ist=tz('Asia/Kolkata'),et=tz('America/New_York');
    if(ds)ds.textContent=ist.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()+' · '+ist.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' IST';
    if(gr){const hh=ist.getHours();gr.textContent=hh<12?'GOOD MORNING.':hh<17?'GOOD AFTERNOON.':'GOOD EVENING.'}
    const inMin=ist.getHours()*60+ist.getMinutes(),wd=ist.getDay()>0&&ist.getDay()<6;
    const usMin=et.getHours()*60+et.getMinutes(),uwd=et.getDay()>0&&et.getDay()<6;
    const inOpen=wd&&inMin>=555&&inMin<930, usOpen=uwd&&usMin>=570&&usMin<960;
    setChip('#chip-in',inOpen);setChip('#chip-us',usOpen);
    if(!el)return;
    if(inOpen){el.textContent='India is live. Closes at 3:30 PM IST.'}
    else if(wd&&inMin<555){
      const s=(555-inMin)*60-ist.getSeconds();
      el.textContent=`India opens in ${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}.`;
    }
    else if(usOpen){el.textContent='New York is live. India opens tomorrow, 9:15 AM.'}
    else{el.textContent='Markets are resting. India opens next session, 9:15 AM IST.'}
  };
  const setChip=(sel,open)=>{const c=$(sel);if(!c)return;c.querySelector('.dot').className='dot'+(open?' live':'');};
  tick();clockTimer=setInterval(tick,1000);
}

/* ---------- nav scroll behaviour ---------- */
let lastY=0;
addEventListener('scroll',()=>{
  const y=scrollY,nav=$('#nav');
  nav.classList.toggle('compact',y>24);
  nav.classList.toggle('hide',y>360&&y>lastY&&!overlay.classList.contains('open'));
  lastY=y;
},{passive:true});

/* ---------- boot sequence ---------- */
function boot(){
  const el=$('#boot');
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(sessionStorage.getItem('alladin-boot')||reduced){el.remove();route();return}
  sessionStorage.setItem('alladin-boot','1');
  el.hidden=false;
  const lines=['READING THE MARKET.','CHECKING MOMENTUM.','LOOKING FOR CATALYSTS.','BUILDING THE THESIS.','ALLADIN IS READY.'];
  const sigs=['TECHNICALS','FUNDAMENTALS','MACRO','NEWS','CATALYSTS','RISK'];
  $('#bootsig').innerHTML=sigs.map(s=>`<span>${s}</span>`).join('');
  const sigEls=$$('#bootsig span');
  let i=0;
  const step=()=>{
    $('#bootline').textContent=lines[i];
    if(i<sigEls.length)sigEls[i].classList.add('ok'),sigEls[i].textContent=sigs[i]+' ✓';
    if(i===lines.length-1){sigEls.forEach((s,j)=>{s.classList.add('ok');s.textContent=sigs[j]+' ✓'});
      setTimeout(()=>{el.classList.add('done');route()},600);return}
    i++;setTimeout(step,520);
  };
  route();setTimeout(step,300);
}
boot();
